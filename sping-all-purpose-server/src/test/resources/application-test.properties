# Safe defaults so the context can start in tests without a live environment.
# Without these, ${DB_URL}/${SMTP_PASS}/${AWS_*} placeholder resolution fails at startup
# and even contextLoads cannot run on a clean machine.

spring.datasource.url=jdbc:postgresql://localhost:5432/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder

spring.app.admin_password=test

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=placeholder
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false

spring.app.cors_allowed=http://localhost:3000
spring.app.aws_access_key=test
spring.app.aws_secret_key=test
spring.app.aws_region=us-east-1
spring.app.aws_bucket_name=test-bucket
