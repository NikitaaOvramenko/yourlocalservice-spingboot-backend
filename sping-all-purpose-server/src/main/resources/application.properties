spring.application.name=sping-all-purpose-server
# The application-wide sender, used by every organization that has no smtp_* settings
# of its own. Host and TLS mode are overridable so switching providers is a config
# change rather than a code edit -- the defaults are the neo.space setup.
#
#   neo.space : SMTP_HOST=smtp0001.neo.space SMTP_PORT=465 SMTP_SSL=true  SMTP_STARTTLS=false
#   Gmail     : SMTP_HOST=smtp.gmail.com     SMTP_PORT=587 SMTP_SSL=false SMTP_STARTTLS=true
#               (EMAIL_SENDER is the full address; SMTP_PASS is an app password, which
#                requires 2-Step Verification on the account)
spring.mail.host=${SMTP_HOST:smtp0001.neo.space}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${EMAIL_SENDER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# Jakarta Mail defaults these to infinite: an SMTP host that accepts the connection and
# then stops responding would otherwise tie up a mail thread indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


spring.app.admin_password=${ADMIN_PASSWORD}

# HMAC-SHA256 signing key for access and refresh tokens. Must be at least 32 bytes --
# Keys.hmacShaKeyFor rejects anything shorter. Changing it invalidates every issued
# token, which is the intended way to force everyone to sign in again.
my.app.jwt-key=${JWT_KEY}

# Mail is excluded from the health check on purpose. Spring's MailHealthIndicator opens
# an SMTP connection, so a transient mail outage would turn /actuator/health into a 503
# and make the platform restart a service that is otherwise perfectly able to accept and
# store quotes -- mail is sent after commit and is already failure-tolerant. The database
# is the dependency worth gating health on.
management.health.mail.enabled=false

# Public base URL the verification link points at. Must not be localhost in production
# or every emailed link is dead on arrival.
spring.app.verification_base_url=${VERIFICATION_BASE_URL:http://localhost:8080}
# Generous on purpose: mail delivery alone can take minutes, so a very short window
# makes verification fail for reasons the user cannot see or control.
spring.app.verification_ttl_minutes=${VERIFICATION_TTL_MINUTES:60}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true


spring.app.cors_allowed=${CORS_ALLOWED}
server.port=${PORT:8080}
spring.app.aws_access_key=${AWS_ACCESS_KEY}
spring.app.aws_secret_key=${AWS_SECRET_KEY}
spring.app.aws_region=${AWS_REGION}
spring.app.aws_bucket_name=${AWS_BUCKET_NAME}

#  "AWS_ACCESS_KEY":"",
                # "AWS_SECRET_KEY":"",
                # "AWS_REGION":""





# Flyway owns the schema. Never edit an applied migration; add a new V-numbered file.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# API documentation. Defaults to on for local work; set SWAGGER_ENABLED=false in
# production, where publishing a map of the admin surface buys nothing. When disabled
# springdoc registers no routes, so /v3/api-docs and /swagger-ui.html simply 404.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
