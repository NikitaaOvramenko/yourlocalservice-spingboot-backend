spring.application.name=sping-all-purpose-server
spring.mail.host=smtp0001.neo.space
spring.mail.port=${SMTP_PORT}
spring.mail.username=${EMAIL_SENDER}
spring.mail.password=${SMTP_PASS}
spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# ssl enable
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# Jakarta Mail defaults these to infinite: an SMTP host that accepts the connection and
# then stops responding would otherwise tie up a mail thread indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.app.cors_allowed=${CORS_ALLOWED}
server.port=${PORT:8080}
spring.app.aws_access_key=${AWS_ACCESS_KEY}
spring.app.aws_secret_key=${AWS_SECRET_KEY}
spring.app.aws_region=${AWS_REGION}
spring.app.aws_bucket_name=${AWS_BUCKET_NAME}

#  "AWS_ACCESS_KEY":"",
                # "AWS_SECRET_KEY":"",
                # "AWS_REGION":""





# Flyway owns the schema. Never edit an applied migration; add a new V-numbered file.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
